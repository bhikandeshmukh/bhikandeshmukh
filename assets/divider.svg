<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="14" viewBox="0 0 1200 14" role="img" aria-label="divider">
  <defs>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="6" width="1200" height="2" rx="1" fill="#334155" opacity=".6"/>
  <rect x="-300" y="5" width="300" height="4" rx="2" fill="url(#sweep)">
    <animate attributeName="x" values="-300;1200" dur="4s" repeatCount="indefinite"/>
  </rect>
  <circle cx="600" cy="7" r="4" fill="#0b1120" stroke="#38bdf8" stroke-width="2">
    <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
